openapi: 3.1.1
info:
  title: JKT48Connect API
  description: |
    The JKT48Connect API provides access to various data related to JKT48 members, live streams, news, events, theater schedules, and video call sessions. 
    
    ## Authentication
    
    This API supports two authentication methods:
    1. **API Key (Query Parameter)** - Standard authentication using `apikey` query parameter
    2. **Priority Token (Header)** - Enhanced authentication using `x-priority-token` header for priority access
    
    You can use either authentication method, but Priority Token is recommended for better performance and priority handling.

    ## Resources

    * https://v2.jkt48connect.com/api
  version: 1.2.0
  contact:
    name: JKT48Connect
    url: https://v2.jkt48connect.com/api
servers:
  - url: https://v2.jkt48connect.com/api
security:
  - apiKeyQuery: []
  - priorityToken: []
tags:
  - name: Members
    description: JKT48 member information and details
  - name: Live Streams
    description: Current and recent live streams across platforms
  - name: Content
    description: YouTube videos and replays
  - name: News & Events
    description: News articles and upcoming events
  - name: Theater
    description: Theater schedules and performances
  - name: Video Call
    description: JKT48 video call sessions and schedules
  - name: Chat
    description: Live stream chat functionality

paths:
  '/jkt48/members':
    get:
      tags:
        - Members
      summary: Get all JKT48 members
      description: Retrieve a list of all JKT48 members.
      operationId: getMembers
      security:
        - apiKeyQuery: []
        - priorityToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Member'

  '/jkt48/member/{name}':
    get:
      tags:
        - Members
      summary: Get JKT48 member details
      description: Retrieve detailed information about a specific JKT48 member.
      operationId: getMemberDetail
      parameters:
        - name: name
          in: path
          required: true
          description: The name of the member.
          schema:
            type: string
      security:
        - apiKeyQuery: []
        - priorityToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemberDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  '/jkt48/birthday':
    get:
      tags:
        - Members
      summary: Get JKT48 member birthdays
      description: Retrieve upcoming or recent JKT48 member birthdays.
      operationId: getBirthdays
      security:
        - apiKeyQuery: []
        - priorityToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Birthday'

  '/jkt48/live':
    get:
      tags:
        - Live Streams
      summary: Get current JKT48 live streams
      description: Retrieve a list of currently active JKT48 live streams across all platforms.
      operationId: getCurrentLives
      security:
        - apiKeyQuery: []
        - priorityToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LiveStream'

  '/jkt48/live/youtube':
    get:
      tags:
        - Live Streams
      summary: Get JKT48 YouTube lives
      description: Retrieve a list of currently active JKT48 YouTube live streams.
      operationId: getYouTubeLives
      security:
        - apiKeyQuery: []
        - priorityToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/YouTubeLive'

  '/jkt48/live/idn':
    get:
      tags:
        - Live Streams
      summary: Get JKT48 IDN lives
      description: Retrieve a list of currently active JKT48 IDN live streams.
      operationId: getIDNLives
      security:
        - apiKeyQuery: []
        - priorityToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/IDNLive'

  '/jkt48/live/showroom':
    get:
      tags:
        - Live Streams
      summary: Get JKT48 Showroom lives
      description: Retrieve a list of currently active JKT48 Showroom live streams.
      operationId: getShowroomLives
      security:
        - apiKeyQuery: []
        - priorityToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShowroomLive'

  '/jkt48/recent':
    get:
      tags:
        - Live Streams
      summary: Get recent JKT48 live streams
      description: Retrieve a list of recently finished JKT48 live streams.
      operationId: getRecentLives
      security:
        - apiKeyQuery: []
        - priorityToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RecentLive'

  '/jkt48/recent/{liveId}':
    get:
      tags:
        - Live Streams
      summary: Get details of a recent JKT48 live stream
      description: Retrieve detailed information about a specific recent JKT48 live stream.
      operationId: getRecentDetail
      parameters:
        - name: liveId
          in: path
          required: true
          description: The ID of the live stream.
          schema:
            type: string
      security:
        - apiKeyQuery: []
        - priorityToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RecentLiveDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  '/jkt48/replay':
    get:
      tags:
        - Content
      summary: Get JKT48 live stream replays
      description: Retrieve a list of available JKT48 live stream replays.
      operationId: getReplays
      security:
        - apiKeyQuery: []
        - priorityToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Replay'

  '/jkt48/youtube':
    get:
      tags:
        - Content
      summary: Get JKT48 YouTube videos
      description: Retrieve information about JKT48 YouTube videos.
      operationId: getYouTubeVideos
      security:
        - apiKeyQuery: []
        - priorityToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/YouTubeVideo'

  '/jkt48/events':
    get:
      tags:
        - News & Events
      summary: Get JKT48 events
      description: Retrieve a list of JKT48 events.
      operationId: getEvents
      security:
        - apiKeyQuery: []
        - priorityToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Event'

  '/jkt48/news':
    get:
      tags:
        - News & Events
      summary: Get JKT48 news
      description: Retrieve a list of JKT48 news articles.
      operationId: getNews
      security:
        - apiKeyQuery: []
        - priorityToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/News'

  '/jkt48/news/{id}':
    get:
      tags:
        - News & Events
      summary: Get JKT48 news detail
      description: Retrieve detailed information about a specific JKT48 news article.
      operationId: getNewsDetail
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the news article.
          schema:
            type: integer
      security:
        - apiKeyQuery: []
        - priorityToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NewsDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  '/jkt48/theater':
    get:
      tags:
        - Theater
      summary: Get JKT48 theater schedules
      description: Retrieve upcoming JKT48 theater schedules.
      operationId: getTheater
      security:
        - apiKeyQuery: []
        - priorityToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Theater'

  '/jkt48/theater/{id}':
    get:
      tags:
        - Theater
      summary: Get JKT48 theater detail
      description: Retrieve detailed information about a specific JKT48 theater schedule.
      operationId: getTheaterDetail
      parameters:
        - name: id
          in: path
          required: true
          description: The ID of the theater schedule.
          schema:
            type: integer
      security:
        - apiKeyQuery: []
        - priorityToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TheaterDetail'
        '404':
          $ref: '#/components/responses/NotFound'

  '/jkt48/videocall':
    get:
      tags:
        - Video Call
      summary: Get JKT48 video call sessions
      description: |
        Retrieve JKT48 video call session data with optional filtering.
        All parameters are optional - if no parameters are provided, all video call data will be returned.
        
        **Example usage:**
        - `/jkt48/videocall` - All video call data (default)
        - `/jkt48/videocall?date=16` - Sessions on date 16
        - `/jkt48/videocall?sesi=1` - All session 1 data
        - `/jkt48/videocall?member=Adeline` - All sessions with Adeline (partial match)
        - `/jkt48/videocall?date=16&sesi=1` - Session 1 on date 16
        - `/jkt48/videocall?member=Adeline&sesi=2` - Session 2 with Adeline
      operationId: getVideocalls
      parameters:
        - name: sesi
          in: query
          required: false
          description: Optional filter by session number (1, 2, 3, etc.). Leave empty for all sessions.
          schema:
            type: integer
          allowEmptyValue: true
        - name: date
          in: query
          required: false
          description: Optional filter by date (format 13, 14, 15, etc.). Leave empty for all dates.
          schema:
            type: integer
          allowEmptyValue: true
        - name: member
          in: query
          required: false
          description: Optional filter by member name (partial match). Leave empty for all members.
          schema:
            type: string
          allowEmptyValue: true
      security:
        - apiKeyQuery: []
        - priorityToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VideocallResponse'

  '/jkt48/videocall/today':
    get:
      tags:
        - Video Call
      summary: Get today's JKT48 video call sessions
      description: |
        Retrieve today's JKT48 video call schedule with real-time status for each session.
        Shows statistics and countdown information for upcoming sessions.
      operationId: getTodayVideocalls
      security:
        - apiKeyQuery: []
        - priorityToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TodayVideocallResponse'

  '/jkt48/chat-stream':
    get:
      tags:
        - Chat
      summary: Get chat stream (JKT48)
      description: Retrieve chat messages for a specific JKT48 live stream.
      operationId: getChatStream
      parameters:
        - name: username
          in: query
          required: true
          description: The username associated with the live stream.
          schema:
            type: string
        - name: slug
          in: query
          required: true
          description: The slug of the live stream.
          schema:
            type: string
      security:
        - apiKeyQuery: []
        - priorityToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'
        '400':
          $ref: '#/components/responses/BadRequest'

  '/jkt48/chat-stream-sr':
    get:
      tags:
        - Chat
      summary: Get Showroom chat stream (JKT48)
      description: Retrieve chat messages for a specific Showroom live stream.
      operationId: getChatStreamSR
      parameters:
        - name: room_id
          in: query
          required: true
          description: The room ID of the Showroom live stream.
          schema:
            type: string
      security:
        - apiKeyQuery: []
        - priorityToken: []
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChatMessage'
        '400':
          $ref: '#/components/responses/BadRequest'

components:
  securitySchemes:
    apiKeyQuery:
      type: apiKey
      in: query
      name: apikey
      description: API key required for authentication
    priorityToken:
      type: apiKey
      in: header
      name: x-priority-token
      description: Priority token for enhanced authentication and priority access

  responses:
    BadRequest:
      description: Bad Request - The request was invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Not Found - The requested resource does not exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  schemas:
    Member:
      type: object
      properties:
        id:
          type: integer
          description: Unique identifier for the member
        name:
          type: string
          description: Member's name
        nickname:
          type: string
          description: Member's nickname
        generation:
          type: string
          description: Member's generation

    MemberDetail:
      allOf:
        - $ref: '#/components/schemas/Member'
        - type: object
          properties:
            birthdate:
              type: string
              format: date
              description: Member's birth date
            bloodType:
              type: string
              description: Member's blood type
            zodiac:
              type: string
              description: Member's zodiac sign

    Birthday:
      type: object
      properties:
        member:
          type: string
          description: Member's name
        date:
          type: string
          format: date
          description: Birthday date
        daysUntil:
          type: integer
          description: Days until birthday

    LiveStream:
      type: object
      properties:
        platform:
          type: string
          enum: [youtube, idn, showroom]
          description: Platform where the stream is happening
        liveId:
          type: string
          description: Unique identifier for the live stream
        title:
          type: string
          description: Title of the live stream
        member:
          type: string
          description: Member hosting the stream
        viewerCount:
          type: integer
          description: Current viewer count

    YouTubeLive:
      type: object
      properties:
        liveId:
          type: string
          description: YouTube live stream ID
        title:
          type: string
          description: Title of the live stream
        member:
          type: string
          description: Member hosting the stream
        viewerCount:
          type: integer
          description: Current viewer count

    IDNLive:
      type: object
      properties:
        liveId:
          type: string
          description: IDN live stream ID
        title:
          type: string
          description: Title of the live stream
        member:
          type: string
          description: Member hosting the stream
        viewerCount:
          type: integer
          description: Current viewer count

    ShowroomLive:
      type: object
      properties:
        liveId:
          type: string
          description: Showroom live stream ID
        title:
          type: string
          description: Title of the live stream
        member:
          type: string
          description: Member hosting the stream
        viewerCount:
          type: integer
          description: Current viewer count

    RecentLive:
      type: object
      properties:
        liveId:
          type: string
          description: Live stream ID
        title:
          type: string
          description: Title of the live stream
        member:
          type: string
          description: Member who hosted the stream
        endTime:
          type: string
          format: date-time
          description: When the stream ended

    RecentLiveDetail:
      allOf:
        - $ref: '#/components/schemas/RecentLive'
        - type: object
          properties:
            duration:
              type: integer
              description: Stream duration in minutes
            platform:
              type: string
              description: Platform where the stream happened
            description:
              type: string
              description: Stream description

    Replay:
      type: object
      properties:
        liveId:
          type: string
          description: Live stream ID
        title:
          type: string
          description: Title of the replay
        member:
          type: string
          description: Member featured in the replay
        url:
          type: string
          format: uri
          description: URL to the replay

    YouTubeVideo:
      type: object
      properties:
        videoId:
          type: string
          description: YouTube video ID
        title:
          type: string
          description: Video title
        publishedAt:
          type: string
          format: date-time
          description: When the video was published
        viewCount:
          type: integer
          description: Video view count

    Event:
      type: object
      properties:
        id:
          type: integer
          description: Event ID
        name:
          type: string
          description: Event name
        date:
          type: string
          format: date-time
          description: Event date and time
        venue:
          type: string
          description: Event venue
        description:
          type: string
          description: Event description

    News:
      type: object
      properties:
        id:
          type: integer
          description: News article ID
        title:
          type: string
          description: News article title
        publishedAt:
          type: string
          format: date-time
          description: When the article was published
        category:
          type: string
          description: News category

    NewsDetail:
      allOf:
        - $ref: '#/components/schemas/News'
        - type: object
          properties:
            content:
              type: string
              description: Full article content
            author:
              type: string
              description: Article author
            tags:
              type: array
              items:
                type: string
              description: Article tags

    Theater:
      type: object
      properties:
        id:
          type: integer
          description: Theater schedule ID
        title:
          type: string
          description: Performance title
        date:
          type: string
          format: date
          description: Performance date
        time:
          type: string
          description: Performance time
        setlist:
          type: string
          description: Setlist name

    TheaterDetail:
      allOf:
        - $ref: '#/components/schemas/Theater'
        - type: object
          properties:
            description:
              type: string
              description: Performance description
            members:
              type: array
              items:
                type: string
              description: Participating members
            ticketInfo:
              type: string
              description: Ticket information

    VideocallSession:
      type: object
      properties:
        id:
          type: integer
          description: Video call session ID
        sesi:
          type: integer
          description: Session number
        date:
          type: integer
          description: Date of the session
        time:
          type: string
          description: Session time
        member:
          type: string
          description: Member participating in the video call
        status:
          type: string
          enum: [upcoming, preparation, ongoing, finished]
          description: Current status of the session
        duration:
          type: integer
          description: Session duration in minutes
        countdown:
          type: integer
          description: Minutes until session starts (for upcoming sessions)

    VideocallResponse:
      type: object
      properties:
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/VideocallSession'
        totalSessions:
          type: integer
          description: Total number of sessions
        currentTime:
          type: string
          format: date-time
          description: Current time in Indonesia timezone

    VideocallStatistics:
      type: object
      properties:
        totalSessions:
          type: integer
          description: Total sessions for today
        ongoingSessions:
          type: integer
          description: Currently ongoing sessions
        finishedSessions:
          type: integer
          description: Finished sessions today
        upcomingSessions:
          type: integer
          description: Upcoming sessions today

    TodayVideocallResponse:
      type: object
      properties:
        date:
          type: string
          format: date
          description: Today's date
        currentTime:
          type: string
          format: date-time
          description: Current time in Indonesia timezone
        statistics:
          $ref: '#/components/schemas/VideocallStatistics'
        sessions:
          type: array
          items:
            $ref: '#/components/schemas/VideocallSession'

    ChatMessage:
      type: object
      properties:
        sender:
          type: string
          description: Message sender username
        message:
          type: string
          description: Chat message content
        timestamp:
          type: string
          format: date-time
          description: When the message was sent
        platform:
          type: string
          description: Platform where the message was sent

    Error:
      type: object
      properties:
        type:
          type: string
          description: Error type
        title:
          type: string
          description: Error title
        status:
          type: integer
          description: HTTP status code
        detail:
          type: string
          description: Detailed error description
